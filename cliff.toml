# Release notes are generated from Conventional Commit subjects when a vX.Y.Z
# tag is pushed (see .github/workflows/release.yml), which is why there is no
# CHANGELOG.md in this repository: the commit log is the changelog.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
# Anything that isn't a Conventional Commit is dropped rather than listed
# untyped: GitHub's own generated notes are appended below this body and
# already carry the full commit list.
filter_unconventional = true
filter_commits = true
protect_breaking_commits = true
tag_pattern = "v[0-9]*"
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^.*", skip = true },
]
