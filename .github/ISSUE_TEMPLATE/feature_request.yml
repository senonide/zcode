name: Feature request
description: Suggest something Zcode should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Zcode aims to stay small and native. Requests that fit the GNOME HIG and
        don't add a dependency have the best odds, see CONTRIBUTING.md.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Zcode makes hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like instead
    validations:
      required: true
